[project]
name = "streamify-spark42"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyspark[pipelines]==4.2.0",
    "delta-spark",
    "streamify",
]

[tool.uv]
override-dependencies = [
    "pyspark==4.2.0"
]

[tool.uv.sources]
streamify = { path = "../streamify", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
